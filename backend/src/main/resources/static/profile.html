<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · StudyForge</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="bg"></div>
  <div id="nav-slot"></div>

  <div class="wrap profile-wrap">
    <div class="card">
      <h2 class="section-title" style="margin:0 0 18px;">👤 Account</h2>
      <div class="hr-flex" style="align-items:flex-start;gap:16px;">
        <div class="avatar big" id="profAvatar">?</div>
        <div style="flex:1;min-width:0;">
          <label class="label">Display name</label>
          <input class="input" id="profName" style="margin-bottom:12px;" />
          <label class="label">Email</label>
          <input class="input" id="profEmail" disabled style="margin-bottom:12px;" />
          <label class="label">Member since</label>
          <div class="t-meta" id="profCreated"></div>
        </div>
      </div>
      <div class="hr-flex" style="justify-content:flex-start;gap:10px;margin-top:14px;">
        <button class="btn btn-brand" id="profSaveBtn" onclick="saveProfile()"><span class="spinner" id="profSpin" style="display:none;"></span> Save profile</button>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h2 class="section-title" style="margin:0 0 18px;">🔐 Password</h2>
      <label class="label">Current password</label>
      <input class="input" type="password" id="pwCurrent" style="margin-bottom:12px;" />
      <label class="label">New password</label>
      <input class="input" type="password" id="pwNew" style="margin-bottom:12px;" />
      <label class="label">Confirm new password</label>
      <input class="input" type="password" id="pwConfirm" style="margin-bottom:14px;" />
      <button class="btn btn-brand" id="pwSaveBtn" onclick="savePassword()"><span class="spinner" id="pwSpin" style="display:none;"></span> Update password</button>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/profile.js"></script>
</body>
</html>
