<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account · StudyForge</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="bg"></div>
  <div class="auth-wrap">
    <div class="card auth-card">
      <a href="index.html" class="brand" style="margin-bottom:18px;font-size:15px;">
        <span class="logo" style="width:28px;height:28px;font-size:13px;">✦</span> StudyForge
      </a>
      <h1>Say the goal.</h1>
      <p class="sub">Create your account and turn a big assignment into your plan.</p>
      <form id="signupForm" novalidate>
        <div class="form-row">
          <label class="label" for="name">Your name</label>
          <input class="input" type="text" id="name" name="name" placeholder="e.g. Aman Gupta" required autocomplete="name" />
        </div>
        <div class="form-row">
          <label class="label" for="email">Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@university.edu" required autocomplete="email" />
        </div>
        <div class="form-row">
          <label class="label" for="password">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="At least 6 characters" required autocomplete="new-password" />
        </div>
        <button class="btn btn-brand btn-block" type="submit" id="submitBtn" style="margin-top:6px;">
          <span class="spinner dark" id="btnSpin" style="display:none;"></span>
          <span id="btnLabel">Get Started</span>
        </button>
      </form>
      <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
