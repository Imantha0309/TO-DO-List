<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · StudyForge</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="bg"></div>
  <div class="auth-wrap">
    <div class="card auth-card" style="position:relative;">
      <a href="index.html" class="brand" style="margin-bottom:18px;font-size:15px;">
        <span class="logo" style="width:28px;height:28px;font-size:13px;">✦</span> StudyForge
      </a>
      <h1>Welcome back 👋</h1>
      <p class="sub">Pick up where you left off.</p>
      <form id="loginForm" novalidate>
        <div class="form-row">
          <label class="label" for="email">Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@university.edu" required autocomplete="email" />
        </div>
        <div class="form-row">
          <label class="label" for="password">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button class="btn btn-brand btn-block" type="submit" id="submitBtn" style="margin-top:6px;">
          <span class="spinner dark" id="btnSpin" style="display:none;"></span>
          <span id="btnLabel">Log in</span>
        </button>
      </form>
      <p class="auth-alt">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
