<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Target · StudyForge</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="bg"></div>
  <div id="nav-slot"></div>

  <div class="wrap">
    <div class="hr-flex" style="justify-content:flex-start;gap:8px;margin-bottom:14px;">
      <a class="btn btn-ghost btn-sm" href="dashboard.html">← Dashboard</a>
      <button class="btn btn-ghost btn-sm" onclick="replanWithAI()" id="replanBtn" title="Rebuild this plan with AI, keeping the same scope">✨ Re-plan with AI</button>
      <button class="btn btn-ghost btn-sm" onclick="exportPlan('csv')" title="Download plan as CSV">⬇ CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="exportPlan('ics')" title="Add milestones and tasks to your calendar">📅 iCal</button>
      <button class="btn btn-ghost btn-sm" onclick="printPlan()" title="Open a print layout (use browser to save as PDF)">🖨 Print / PDF</button>
    </div>

    <div class="viewer-banner" id="viewerBanner" style="display:none;">
      👁 You have <strong>view-only</strong> access. Changes are disabled.
    </div>

    <div id="execPanel" class="card" style="display:none;"></div>

    <div class="card">
      <div class="hr-flex" style="align-items:flex-start;">
        <div style="flex:1;min-width:0;">
          <div class="hr-flex" style="gap:8px;justify-content:flex-start;margin-bottom:6px;">
            <input class="input" id="tTitle" style="font-size:22px;font-weight:800;border:none;background:transparent;padding:0;height:auto;" />
            <span class="badge b-AI" id="tSourceBadge"></span>
            <span class="badge" id="tStatusBadge"></span>
          </div>
          <div class="t-meta" style="gap:12px;">
            <label class="label" style="display:inline;margin:0;">module <input class="input" id="tCourse" style="width:120px;display:inline-block;font-size:13px;" /></label>
            <label class="label" style="display:inline;margin:0;">start <input class="input" type="date" id="tStart" style="width:132px;display:inline-block;font-size:13px;" /></label>
            <label class="label" style="display:inline;margin:0;">deadline <input class="input" type="date" id="tDeadline" style="width:132px;display:inline-block;font-size:13px;" /></label>
            <label class="label" style="display:inline;margin:0;">priority
              <select class="select" id="tPriority" style="width:110px;display:inline-block;font-size:13px;">
                <option>LOW</option><option>MEDIUM</option><option>HIGH</option>
              </select></label>
          </div>
          <input class="input" id="tDesc" style="margin-top:12px;font-size:14px;" placeholder="Description (optional)" />
        </div>
        <div class="progress-ring" id="tRing">
          <span class="ring-txt"></span>
        </div>
      </div>
      <div class="ai-note" id="tAiNotes" style="display:none;"></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="hr-flex">
        <h2 class="section-title" style="margin:0;font-size:17px;">👥 Members</h2>
        <div style="display:flex;gap:8px;align-items:center;" id="memberAddBox">
          <input class="input" id="memberInput" placeholder="Add member name" style="width:220px;" />
          <button class="btn btn-ghost btn-sm" onclick="addMember()">Add</button>
        </div>
      </div>
      <div class="member-list" id="memberList" style="margin-top:10px;"></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="hr-flex">
        <h2 class="section-title" style="margin:0;font-size:17px;">🔗 Sharing</h2>
        <span class="t-meta" id="accessBadge" style="gap:6px;"></span>
      </div>
      <div class="t-meta" id="accessHint" style="gap:8px;margin-top:8px;"></div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px;" id="inviteBox">
        <input class="input" id="collabInput" placeholder="Invite a teammate by email" style="width:260px;" />
        <button class="btn btn-ghost btn-sm" onclick="inviteCollaborator()">Invite</button>
      </div>
      <div class="member-list" id="collabList" style="margin-top:10px;"></div>
    </div>

    <div id="milestoneList" style="margin-top:22px;"></div>

    <div class="card" style="margin-top:22px;">
      <h2 class="section-title" style="margin:0;font-size:17px;">🕓 Activity</h2>
      <div class="member-list" id="activityList" style="margin-top:10px;"></div>
    </div>

    <div class="hr-flex" style="position:sticky;bottom:14px;background:rgba(238,241,251,.85);backdrop-filter:blur(14px);padding:12px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.7);margin-top:22px;box-shadow:var(--shadow);">
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-danger" id="delBtn" onclick="delTarget()">Delete target</button>
        <button class="btn btn-ghost" id="leaveBtn" style="display:none;" onclick="leaveTarget()">Leave shared target</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-brand" onclick="saveAll()"><span class="spinner" id="saveSpin" style="display:none;"></span> Save changes</button>
      </div>
    </div>
  </div>

  <div id="printArea" class="print-only"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/target.js"></script>
</body>
</html>
