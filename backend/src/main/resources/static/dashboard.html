<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · StudyForge</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="bg"></div>
  <div id="nav-slot"></div>

  <div class="wrap">
    <div class="hr-flex">
      <h1 class="section-title" style="font-size:26px;">Notice board</h1>
      <a class="btn btn-brand" href="create.html">+ Add New Target</a>
    </div>

    <div class="grid grid-4" id="statGrid"></div>

    <div class="grid grid-2" style="margin-top:18px;">
      <div class="card">
        <h2 class="section-title" style="font-size:17px;">Today's actions</h2>
        <div id="todayList"></div>
      </div>
      <div class="card">
        <h2 class="section-title" style="font-size:17px;">Upcoming deadlines</h2>
        <div id="deadlineList"></div>
      </div>
    </div>

    <div class="section">
      <div class="hr-flex" style="align-items:flex-start;flex-wrap:wrap;gap:10px;">
        <h2 class="section-title" style="margin:0;">Your targets</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <input class="input" id="searchInput" placeholder="Search targets…" style="width:190px;" oninput="renderTargets()" />
          <select class="select" id="statusFilter" onchange="renderTargets()" style="width:150px;">
            <option value="ALL">All statuses</option>
            <option value="ACTIVE">Active</option>
            <option value="COMPLETED">Completed</option>
            <option value="ARCHIVED">Archived</option>
          </select>
          <select class="select" id="sortSelect" onchange="renderTargets()" style="width:175px;">
            <option value="updated">Recently updated</option>
            <option value="deadline">Closest deadline</option>
            <option value="priority">Priority</option>
            <option value="progress">Progress</option>
          </select>
        </div>
      </div>
      <div id="targetList"></div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
